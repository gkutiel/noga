        Highlight any gaps in the literature that your work aims to address.

Problem Formulation:
  - Mention the Newsvendor framework as a tool for modeling asymmetric costs in demand forecasting:
      - >
        Introduce the Newsvendor problem, which is a classic model in operations research that deals with inventory management under uncertainty. 
        Explain how this framework can be adapted to model the asymmetric costs of overestimation and underestimation in electricity demand forecasting.
      - >
        Emphasize the limitations of the Newsvendor framework:
        - It assumes linearity in costs, which may not always hold in real-world scenarios.
        - It assumes a known probability distribution of demand, which may not be accurate in practice.
  - Formulate the problem:
      - >
        Given an arbitrary demand distribution, and arbitrary cost functions for overestimation and underestimation,
        how can we determine the optimal forecasting strategy that minimizes expected costs?

      - Mention that, in this paper, we do not have an access to actual costs
      - We will generate synthetic cost functions to evaluate the performance of our forecasting models under different cost scenarios.
      - Qualitatively the cost functions behave:
          - overestimation:
              - The cost is monotonically increasing with the degree of overestimation,
              - The cost is convex, meaning that the marginal cost of overestimation increases as the degree of overestimation increases.
          - underestimation:
              - The cost is monotonically increasing with the degree of underestimation,
              - The cost is convex, meaning that the marginal cost of underestimation increases as the degree of underestimation increases.

