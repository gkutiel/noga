presentation:
  title: Integrated Probabilistic Forecasting of Electricity Demand and Renewable Generation for Risk-Aware Grid Operation
  authors:
    - Assoc. Prof. Or Aleksandrowicz
    - Prof. Avigdor Gal
    - Dr. Gilad Kutiel

  slides:
    - title: Research Staff
      content:
        - 3 columns from left to right (or, avi, gilad)
        - add 2-3 highlights for each person

    - title: End to End Cost optimized Decision Making
      content:
        - We propose a novel end-to-end framework for cost-optimized decision making in the electricity grid.
        - Illustrate the framework with a 3 layer model:
            - Layer 1 (bottom): Probabilistic Forecasting, inputs are weather data, historical demand
            - Layer 2 (middle): Net Demand Forecasting, inputs are historical demand
            - Layer 3 (top): Risk-Aware Decision Making, inputs bidding

    - title: Point Prediction vs. Probabilistic Forecasting
      content:
        - On top "Tomorrow Demand?" on bottom split the slide into two halves:
            - On the left is point prediction and just write a big "7"
            - On The right reveal one by one a grid of probabilistic distributions where the mean is 7:
                - Normal distribution, Normal distribution with small variance, Normal distribution with large variance, A distribution with two peaks, etc... overall show 9 distributions in a 3x3 grid.
                - Reveal the first 3 one by one, then the rest.

    - title: Net Demand and Renewable Generation Forecasting
      content:
        - On the left show a distribution of the Renewable Generation Forecast
        - On the right show a distribution of the Total Demand Forecast
        - Then draw arrow from them to the bottom center and show the combined Net Demand Forecast distribution.
        - Finally reveal the caveat below the diagram - demand and renewable generation are strongly
          dependent, the marginals do not determine the difference, the joint law must be modelled.
      note: We can not just subtract the two distributions as they are likely highly dependent, we need to use a probabilistic model to combine them.

    - title: Risk-Aware Prediction
      content:
        - Show a distribution of the Net Demand combined with:
            - Day ahead Market Bidding data (illustrated as a monotone increasing step function)
            - Real-time Market Bidding Forecast (illustrated as a probabilistic distribution)

    - title: Full Distribution vs Confidence Interval
      content:
        - Reveal two strongly skewed mirror-image distributions sharing the same 90% interval (grey band):
            - "Forecast A: long right tail. Forecast B: the same density reflected, long left tail"
            - Caption reads "Identical 90% interval - mirrored tail risk"
        - Then mark the cost-optimal reserve d* on each, under the 5:1 under-prediction penalty.
        - Then reveal the argument, one bullet at a time:
            - Same endpoints, mirrored shape - the interval cannot tell a shortfall risk from a surplus risk.
            - Cost-optimal decisions integrate the density; two endpoints cannot supply it. The two d* differ visibly.
            - One density serves every risk level - any quantile, any reserve margin, no refitting.
      note: >
        The density is located at s=0.17624, the unique shift making q05+q95=2, so the
        90% interval is symmetric about the centre and reflection leaves it exactly
        invariant. d* is the 5/6 quantile and must be recomputed per curve, not mirrored:
        for Y=2-X the identity is q_Y(5/6) = 2 - q_X(1/6). Both d* land above the centre
        (the penalty always hedges upward) but at clearly different reserves - which is
        the point: identical intervals, different decisions.

    - title: Solution
      content:
        - Describe which models we are going to use for full distribution probabilistic forecasting.
        - Two columns, each showing a network glyph feeding its output down into a density:
            - "Left (reveal first): deep network with a Gaussian head, outputs (mu, sigma), draws a symmetric bell"
            - "Right (reveal second): normalizing flow, network conditions an invertible map f_theta, draws a skewed bimodal density"
        - Under each column a pro and a con - closed form but always unimodal and symmetric, versus exact likelihood and any shape.
        - Then reveal the callback - a Gaussian head cannot represent Forecast A or B from the previous slide, the flow can.
        - Finally reveal that both are fit by maximum likelihood and ranked by proper scores and by operational cost.
      note: The two densities are scaled to enclose the same area (1.05 over the plotted range), so the flow is not read as carrying less probability mass.

    - title: Recap
      content:
        - Draw a 3 layer model:
            - Layer 1 (bottom): Probabilistic Forecasting, inputs are weather data, historical demand
            - Layer 2 (middle): Net Demand Forecasting, inputs are historical demand
            - Layer 3 (top): Risk-Aware Decision Making, inputs bidding

        - All inputs should be illustrated (no text at all) and shown as arrows going into the respective layers.

    - title: Preliminary Results
      content:
        - Operational Cost Reduction
        - Split the slide into two and show big numbers:
            - 40% - 73%
            - 8% - 17%

