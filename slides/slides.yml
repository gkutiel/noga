# This is the structure for a Beamer presentation based on our research_proposal
# Read the research_proposal and create the presentation

presentation:
  title: Integrated Probabilistic Forecasting of Electricity Demand and Renewable Generation for Risk-Aware Grid Operation
  authors:
    - Assoc. Prof. Or Aleksandrowicz
    - Prof. Avigdor Gal
    - Dr. Gilad Kutiel

  slides:
    - title: Point Prediction vs. Probabilistic Forecasting
      content:
        - On top "Tomorrow Demand?" on bottom split the slide into two halves:
            - On the left is point prediction and just write a big "7"
            - On The right reveal one by one a grid of probabilistic distributions where the mean is 7:
                - Normal distribution, Normal distribution with small variance, Normal distribution with large variance, A distribution with two peaks, etc... overall show 9 distributions in a 3x3 grid.
                - Reveal the first 3 one by one, then the rest.

    - title: Net Demand and Renewable Generation Forecasting
      content:
        - On the left show a distribution of the Renewable Generation Forecast
        - On the right show a distribution of the Total Demand Forecast
        - Then draw arrow from them to the bottom center and show the combined Net Demand Forecast distribution.

    - title: Risk-Aware Prediction
      content:
        - Draw a 3 layer model:
            - Layer 1 (bottom): Probabilistic Forecasting, inputs are weather data, historical demand
            - Layer 2 (middle): Net Demand Forecasting, inputs are historical demand
            - Layer 3 (top): Risk-Aware Decision Making, inputs bidding

        - All inputs should be illustrated (no text at all) and shown as arrows going into the respective layers.

    - title: Preliminary Results
      content:
        - Operational Cost Reduction
        - Split the slide into two and show big numbers:
            - 40% - 73%
            - 8% - 17%

    - title: Questions and Discussion
      content:
        - Show a big question mark in the center of the slide.
