[project]
name = "noga"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "csvkit>=2.2.0",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pytorch-lightning>=2.6.1",
    "scipy>=1.17.1",
    "tensorboard>=2.17,<2.18",
    "torch>=2.10.0",
]

[project.scripts]
noga-stat = "noga.stat:main"
train = "noga.train:main"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[tool.setuptools.packages.find]
include = ["noga*"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
]

[tool.pyright]
include = ["noga"]
venvPath = "."
venv = ".venv"
